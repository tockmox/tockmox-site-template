# Syncs every SealedSecret under secrets/ in this repository. SealedSecrets are
# safe to commit ... that is the point of them ... so they travel with the site
# and are applied like anything else, rather than by a kubectl step nobody
# writes down. The controller in kube-system decrypts them into real Secrets.
#
# Sync-wave 1, matching what tockmox-install.sh generates: ahead of every layer
# that consumes a secret (identity is 4, observability 3, ai 5). A Secret that
# arrives after the Deployment mounting it is the same outage, just later.
#
# Added at v0.6.1. Before that this file was generated by the installer and
# missing from this template, so a site cloned from here committed its sealed
# secrets and never applied them: CreateContainerConfigError on Authentik,
# Grafana, LiteLLM and ntfy, which reads as a broken chart rather than an
# unapplied secret (TM-0675, TM-0698).
#
# Single-source, unlike the layer Applications: it points only at YOUR
# repository, so its targetRevision stays `main` and is not part of the release
# re-pin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: site-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: PLACEHOLDER_SITE_REPO_URL
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # A SealedSecret in a namespace the policy layer has not created yet fails
    # the sync; retry until it exists. The installer has generated this block
    # since it wrote this file; the template lacked it until TM-0621 compared
    # the two, so a site cloned from here could leave site-secrets failed after
    # its first sync, with every secret-mounting workload waiting on a Secret
    # that never arrived.
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
