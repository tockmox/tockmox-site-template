# Syncs everything under apps/ in this repository ... your own workloads,
# ordered after every Tockmox layer. Manifests carry their own namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: site-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: PLACEHOLDER_SITE_REPO_URL
    targetRevision: main
    path: apps
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
